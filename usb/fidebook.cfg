# FideBookOS 1.25 boot & system configuration (shell syntax, editable on any computer)

# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none

# Graphics & hardware detection
LOAD_I915=auto
LOAD_WIFI=0
EXTRA_SLEEP=0
HWDETECT=1

# MODE: what booting this USB drive does:
#   ask     show the FideBookOS Graphical Boot Menu: Live / Graphical Installer / Boot SSD (default)
#   live    run FideBookOS live from USB (nothing saved)
#   install launch the FideBookOS Graphical Installer directly
#   boot    boot the installed SSD system if present, else live
MODE=ask

# Display density (dpi): auto (default) calculates optimal scaling from screen resolution.
DENSITY=auto
RESOLUTION=

# Optional explicit installer target disk (e.g. nvme0n1, mmcblk0, sda) and install mode (dualboot | clean).
# Typing the physical disk serial number on the laptop is ALWAYS required before erasing a disk.
#INSTALL_DISK=nvme0n1
#FIDEBOOK_INSTALL_MODE=dualboot

# Require AVX2 CPU support (1 = default, 0 = boot anyway)
REQUIRE_AVX=1

# GPU acceleration & Vulkan HAL selection:
# GPU_SOFTWARE=auto: swap Intel-only HALs on AMD Radeon / Ryzen or legacy Intel Gen <= 8; untouched on Intel Gen 9+.
# GPU_VULKAN=auto: on AMD amdgpu, bind optimized multi-queue Vulkan 1.4 RADV (vulkan.radv.so) with native Vulkan HWUI,
#                  SurfaceFlinger skiavkthreaded, hardware blurs, and GPU scroll motion blur; fallback to SwiftShader.
GPU_SOFTWARE=auto
GPU_VULKAN=auto

# FideBookOS 1.25 Liquid Glass Background Refraction (Taskbar, Control Center & App Menu):
#   1 (default) live GPU Snell's-law refraction + RGB dispersion + Fresnel crystal rim highlights
#   0           disable Liquid Glass (also toggleable live anytime in Settings -> Display & touch)
LIQUID_GLASS=1
LIQUID_GLASS_LEVEL=2

# FideBookOS Hardware GPU Scroll Motion Blur:
#   ui  (default) smooth 9-tap shutter motion blur when scrolling App Menu, Settings, and Control Center
#   all           enable scroll motion blur across all hardware-rendered Vulkan apps
#   0             disable scroll motion blur
MOTION_BLUR=ui

# ARM64 mobile app native bridge:
#   auto (default) selects Google Berberis (libndk_translation.so) on AMD Ryzen / non-AVX-512 CPUs
NATIVE_BRIDGE=auto

# Device identity shown across Settings > About, Bluetooth, Quick Share, and Chrome ("FideBook" default; "auto" uses DMI)
DEVICE_MODEL="FideBook"

# Production telemetry & debug logging:
#   0 (default, Stable Release) minimal disk writes, no KVM ftrace overhead, no 5s global sync loop
#   1                           full hardware bring-up diagnostics (logcat, audio/display/BT/AI dumps)
DEBUG_TELEMETRY=0

# KernelSU manager app auto-install on first boot (1 = install, 0 = daemon only)
KSU_MANAGER=1

# Material 3 FideBook Setup Wizard on first boot (1 = launch Material 3 laptop setup screen on first boot, 0 = skip straight to desktop)
OOBE_SETUP=1

# Driver module parameters (space-separated "module.param=value")
MODOPTS="mt7921_common.disable_clc=1"

# Early SHA-NI/VNNI-free libz + libcrypto bind before stage0 dmctl
[ -f /fidebook/fidebook/early_patch.sh ] && . /fidebook/fidebook/early_patch.sh
